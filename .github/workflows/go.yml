name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Unit-Tests (race detector)
        run: go test -race -v ./...
      - name: Vet
        run: go vet ./...

  build:
    name: Build
    strategy:
      matrix:
        include:
          - target: linux-amd64
            go-arch: amd64
          - target: linux-arm64
            go-arch: arm64
          - target: linux-armv7
            go-arch: arm
            go-arm: '7'
          - target: linux-armv6
            go-arch: arm
            go-arm: '6'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.go-arch }}
          GOARM: ${{ matrix.go-arm }}
          BINARY: mqtt-executor-${{ matrix.target }}
        run: go build -o "$BINARY" ./cmd/mqtt-executor/
