name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    name: Build
    strategy:
      matrix:
        go-os: [linux, windows]
        go-arch: [386, amd64, arm, arm64]
        exclude:
          - go-os: windows
            go-arch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Unit-Tests (race detector)
        run: go test -race -v ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.go-os }}
          GOARCH: ${{ matrix.go-arch }}
        run: |
          #arm binaries target GOARM=6 explicitly: they run on v6 AND v7
          #hardware (Go's implicit default for GOARCH=arm is v7)
          if [ "$GOARCH" = "arm" ]; then
            export GOARM=6
          fi
          BINARY=mqtt-executor-${{ matrix.go-os }}-${{ matrix.go-arch }}
          if [ "$GOOS" = "windows" ]; then
            BINARY=$BINARY.exe
          fi
          go build -o "$BINARY" ./cmd/mqtt-executor/
