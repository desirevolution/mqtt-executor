openapi: 3.0.3
info:
  title: mqtt-executor webhook API
  description: |
    HTTP ingress next to MQTT: start/interrupt trigger commands
    and query sensor commands on demand. Synchronous calls return the result.
    Asynchronous trigger starts return 202 on acceptance. A configured MQTT
    connection receives the same state and result publications.

    Note: a trigger timeout (config `timeout`) and an intentional stop both
    return HTTP 200 with result `<INTERRUPTED>`. A command that exits
    non-zero returns HTTP 500 with result `<FAILED>;...`.
  version: 1.0.0
paths:
  /trigger/{id}:
    post:
      summary: Start a trigger and wait for its completion
      description: |
        Executes the trigger's command and waits for it to finish. The raw
        request body is passed to the command as stdin when the trigger is
        configured with `stdin_payload: true`.
      parameters:
        - name: id
          in: path
          required: true
          description: Configured webhook_id
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: false
        description: |
          Payload (passed to the command as stdin if configured). Limited to
          1 MiB — larger bodies are rejected with 400.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Command finished (or was intentionally interrupted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Request body too large (limit 1 MiB) or unreadable
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unknown trigger
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: Command already running (state RUNNING, empty result)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '500':
          description: Command execution failed (result starts with `<FAILED>;`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
    delete:
      summary: Interrupt a running command of this trigger (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          description: Configured webhook_id
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: Trigger exists (state STOPPED — also when nothing was running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '404':
          description: Unknown trigger
          content:
            text/plain:
              schema:
                type: string
  /trigger/{id}/run:
    post:
      summary: Start a trigger asynchronously
      description: |
        Accepts an optional raw body, passed to stdin when enabled. The response
        confirms acceptance. A running trigger rejects additional starts.
      parameters:
        - name: id
          in: path
          required: true
          description: Configured webhook_id
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      requestBody:
        required: false
        description: Optional payload, limited to 1 MiB.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Execution accepted
        '400':
          description: Request body too large or unreadable
        '404':
          description: Unknown trigger
        '409':
          description: Trigger already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
  /trigger/{id}/stop:
    post:
      summary: Alias for DELETE /trigger/{id}
      parameters:
        - name: id
          in: path
          required: true
          description: Configured webhook_id
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      responses:
        '200':
          description: Trigger exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '404':
          description: Unknown trigger
          content:
            text/plain:
              schema:
                type: string
  /sensor/{name}:
    get:
      summary: Measure a sensor on demand
      description: |
        Starts or joins an active measurement and returns its output. A
        configured MQTT result topic receives the output even when a
        publish_on_change check would otherwise skip it. HTTP returns once
        the measurement finishes, which may be before MQTT delivery.
        HEAD is rejected without starting a measurement.
      parameters:
        - name: name
          in: path
          required: true
          description: Sensor name (single sensors) or multi sensor value name
          schema:
            type: string
      responses:
        '200':
          description: Command output (plain text, trimmed)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Unknown sensor
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Command execution failed (body starts with `<FAILED>;`)
          content:
            text/plain:
              schema:
                type: string
  /status:
    get:
      summary: Liveness and MQTT connection status
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  mqtt:
                    type: string
                    enum: [disabled, disconnected, connected]
                  uptime:
                    type: string
                    example: 1h2m3s
  /metrics:
    get:
      summary: Prometheus metrics
      description: Command runs, errors and durations per entity (type, name).
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    TriggerResponse:
      type: object
      properties:
        state:
          type: string
          enum: [STOPPED, RUNNING]
          description: Final state of the trigger (RUNNING only for 409 responses)
        result:
          type: string
          description: |
            Command output (stdout+stderr, trimmed), `<INTERRUPTED>` after a
            stop/timeout, `<FAILED>;<error>` on execution failure.
